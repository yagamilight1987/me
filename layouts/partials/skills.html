<section id="equipment" class="py-20 px-6 border-y border-charcoal bg-onyx">
  <div class="max-w-7xl mx-auto">
    <div class="mb-12 text-center">
      <div
        class="inline-block px-3 py-1 mb-4 text-xs font-bold tracking-widest text-blood-red uppercase border border-blood-red/30 bg-blood-red/10 rounded-sm">
        Skills
      </div>
      <h2 class="text-3xl md:text-5xl font-bold text-white">Full-stack with React expertise and AI integrations
      </h2>
      <p class="text-silver/70 mt-4 text-sm max-w-2xl mx-auto">
        Arsenal of languages, frameworks, and tools deployed in production environments.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      {{ range site.Data.skills }}
      <div class="bg-gunmetal/50 border border-charcoal p-6 rounded-lg">
        <h3 class="text-white font-bold mb-4 flex items-center">
          <span class="w-1.5 h-6 bg-blood-red mr-3 rounded-full"></span>
          {{ .name }}
        </h3>
        <div class="flex flex-wrap gap-2">
          {{ range .items }}
          <span
            class="px-2 py-1 bg-onyx border border-charcoal rounded text-xs text-silver hover:border-blood-red transition-colors cursor-default">{{ . }}</span>
          {{ end }}
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
