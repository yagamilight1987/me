<section id="street-cred" class="py-24 px-6 overflow-hidden horiz-gallery-wrapper">
  <div class="max-w-7xl mx-auto">
    <div class="mb-16">
      <div
        class="inline-block px-3 py-1 mb-4 text-xs font-bold tracking-widest text-blood-red uppercase border border-blood-red/30 bg-blood-red/10 rounded-sm">
        TESTIMONIALS
      </div>
      <h2 class="text-4xl md:text-5xl font-bold text-white">What colleagues and clients say</h2>
    </div>

    <!-- Horizontal Scroll Gallery -->
    <div class="horiz-gallery-strip flex gap-8 pb-12">
      {{ range site.Data.testimonials }}
      <div class="testimonial-card flex-shrink-0 w-[85vw] md:w-[600px]">
        <blockquote
          class="p-8 bg-gunmetal/30 border-l-4 border-blood-red backdrop-blur-sm rounded-r-lg h-full flex flex-col justify-center">
          <p class="text-lg md:text-xl text-silver italic mb-6 leading-relaxed">
            "{{ .quote }}"
          </p>
          <footer>
            <div class="font-bold text-white text-lg">{{ .name }}</div>
            <div class="text-sm text-blood-red font-mono">{{ .title }}</div>
          </footer>
        </blockquote>
      </div>
      {{ end }}
    </div>
</section>
