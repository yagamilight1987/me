<header id="hero-section"
  class="relative w-full h-[700px] md:h-screen bg-center bg-cover overflow-hidden flex items-center px-6"
  style="background-image: url('{{ "images/hero.webp" | relURL }}')">
  <div class="absolute inset-0 bg-black/60 z-0"></div>
  <div class="max-w-7xl mx-auto relative z-10 w-full">
    <p class="text-xl md:text-2xl text-silver mb-2 font-medium tracking-wide">Hi, my name is</p>
    <h1 class="text-6xl md:text-9xl font-bold tracking-tighter leading-none mb-4 text-white uppercase">
      NAMITH <span class="text-transparent bg-clip-text bg-gradient-to-r from-blood-red to-red-800">SCINDHIA</span>
    </h1>
    <h2 id="hero-title" class="text-2xl md:text-4xl font-bold tracking-tight text-white/90 mb-8 uppercase">
      Forward Deployed Engineer
    </h2>

    <div class="border-l-4 border-blood-red pl-6 space-y-6">
      <div>
        <p class="text-xl text-silver mb-2">India</p>
        <div class="flex items-center space-x-6 text-sm font-bold tracking-widest uppercase">
          <a href="#" class="text-white hover:text-blood-red transition-colors flex items-center gap-2">
            LinkedIn
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
              <path d="M7 7l10 10" />
              <path d="M17 7v10H7" />
            </svg>
          </a>
          <a href="#" class="text-white hover:text-blood-red transition-colors flex items-center gap-2">
            GitHub
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
              <path d="M7 7l10 10" />
              <path d="M17 7v10H7" />
            </svg>
          </a>
        </div>
      </div>

      <div
        class="inline-block px-4 py-2 bg-blood-red/20 border border-blood-red text-blood-red font-bold tracking-wider uppercase text-sm rounded-sm">
        Open to Hire
      </div>
    </div>
  </div>

  <!-- Scroll Down Button -->
  <a href="#profile"
    class="absolute bottom-8 left-1/2 transform -translate-x-1/2 text-silver/50 hover:text-blood-red transition-colors duration-300 z-20 animate-bounce"
    aria-label="Scroll to content">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
      class="w-10 h-10">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
    </svg>
  </a>
  <!-- Background Elements -->
  <div class="absolute top-0 right-0 w-1/2 h-full bg-blood-red/5 blur-[120px] rounded-full -z-0"></div>
</header>
